<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GemBox - Mystery Box</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1a0000);
      color: #ffd700;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      text-align: center;
    }
    h1 {
      font-size: 4rem;
      margin-top: 30px;
      text-shadow: 0 0 20px #ffd700;
    }
    .box {
      width: 280px;
      height: 280px;
      margin: 40px auto;
      background: linear-gradient(#ffd700, #b8860b);
      border-radius: 20px;
      box-shadow: 0 0 60px #ffd700;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .box:hover {
      transform: scale(1.08);
    }
    .opened {
      animation: openBox 1.5s forwards;
    }
    @keyframes openBox {
      0% { transform: scale(1) rotate(0); }
      50% { transform: scale(1.3) rotate(8deg); }
      100% { transform: scale(0.9) rotate(-5deg); }
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .reveal {
      opacity: 0;
      animation: popIn 0.8s forwards;
    }
    @keyframes popIn {
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>「:gem: GemBox :gem:」</h1>
  <p style="font-size:1.3rem;">Luxury Mystery Box</p>
  
  <div class="box" id="mysteryBox">
    <h2 style="padding-top:100px; color:#000;">CLICK TO OPEN</h2>
  </div>

  <div id="rewards" class="video-grid" style="display:none;"></div>

  <script>
    const box = document.getElementById('mysteryBox');
    const rewards = document.getElementById('rewards');

    box.addEventListener('click', () => {
      box.classList.add('opened');
      
      setTimeout(() => {
        box.style.display = 'none';
        rewards.style.display = 'grid';
        
        // Example videos - replace with your links
        const videos = [
          "Video 1 - Rare Drop",
          "Video 2 - Legendary",
          "Video 3 - Exclusive",
          "Video 4 - Big Ass Pack",
          "Video 5 - POV Special"
        ];

        videos.forEach((v, i) => {
          setTimeout(() => {
            const div = document.createElement('div');
            div.className = 'reveal';
            div.innerHTML = `<h3>✨ ${v}</h3><p>Enjoy the haul king 🔥</p>`;
            rewards.appendChild(div);
          }, i * 400);
        });
      }, 1200);
    });
  </script>
</body>
</html>
