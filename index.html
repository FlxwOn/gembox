<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GemBox - Mystery Box</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a0a, #1f0000);
      color: #ffd700;
      font-family: 'Georgia', serif;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 4.5rem;
      margin: 30px 0 10px;
      text-shadow: 0 0 30px #ffd700;
      letter-spacing: 4px;
    }
    .subtitle { font-size: 1.4rem; color: #aaa; margin-bottom: 30px; }

    .box {
      width: 320px;
      height: 320px;
      margin: 40px auto;
      background: linear-gradient(45deg, #ffd700, #b8860b, #ffd700);
      border-radius: 25px;
      box-shadow: 0 0 80px #ffd700;
      cursor: pointer;
      transition: all 0.4s;
    }
    .box:hover { transform: scale(1.1) rotate(5deg); }

    .rewards {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .reward {
      background: #1a1a1a;
      border-radius: 15px;
      padding: 15px;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.6s;
    }
    .reward.show {
      opacity: 1;
      transform: scale(1);
    }
    .rare { border: 2px solid #a020f0; box-shadow: 0 0 20px #a020f0; }
    .legendary { border: 3px solid #ff0000; box-shadow: 0 0 30px #ff0000; }
  </style>
</head>
<body>
  <h1>「:gem: GemBox :gem:」</h1>
  <p class="subtitle">Luxury Mystery Unboxing</p>
  
  <div class="box" id="mysteryBox">
    <h2 style="padding-top:120px; color:#000; font-size:2rem;">OPEN GEMBOX</h2>
  </div>

  <div id="rewards" class="rewards"></div>

  <script>
    const box = document.getElementById('mysteryBox');
    const rewardsContainer = document.getElementById('rewards');

    box.addEventListener('click', () => {
      box.style.transition = "transform 1.2s";
      box.style.transform = "scale(0.6) rotate(360deg)";

      setTimeout(() => {
        box.style.display = "none";
        rewardsContainer.style.display = "grid";

        const items = [
          {text: "Big Ass Collection", rarity: "common"},
          {text: "POV Boat Sex", rarity: "rare"},
          {text: "Exclusive OnlyFans Pack", rarity: "legendary"},
          {text: "Thicc Latina Special", rarity: "rare"},
          {text: "Public Risk Video", rarity: "common"}
        ];

        items.forEach((item, i) => {
          setTimeout(() => {
            const div = document.createElement('div');
            div.className = `reward ${item.rarity}`;
            div.innerHTML = `
              <h3>✨ ${item.text}</h3>
              <p style="color:#aaa;">GemBox Drop</p>
            `;
            rewardsContainer.appendChild(div);
            
            setTimeout(() => div.classList.add('show'), 100);
          }, i * 450);
        });
      }, 1000);
    });
  </script>
</body>
</html>
